<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>OKTSHOP17 - Pesan Cemilan</title>

  <style>
    body{
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background:#fff8f0;
      margin:0;
      padding:0;
    }

    header{
      background:#ff5722;
      color:white;
      padding:20px;
      text-align:center;
      font-size:24px;
      font-weight:bold;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    .container{
      padding:15px;
      max-width:700px;
      margin:auto;
    }

    .welcome{
      background:white;
      padding:15px;
      border-radius:12px;
      margin-bottom:20px;
      box-shadow:0 2px 8px rgba(0,0,0,0.1);
      line-height:1.6;
    }

    .product{
      background:white;
      margin-bottom:15px;
      padding:15px;
      border-radius:12px;
      box-shadow:0 2px 8px rgba(0,0,0,0.08);
    }

    .product h3{
      margin-top:0;
      color:#ff5722;
      border-bottom: 2px solid #fff8f0;
      padding-bottom: 5px;
    }

    .item{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin:12px 0;
      border-bottom:1px solid #eee;
      padding-bottom:12px;
    }

    .item-info {
      flex: 1;
    }

    .item-name {
      font-weight: bold;
      display: block;
    }

    .item-price {
      color: #666;
      font-size: 14px;
    }

    .qty-control {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-right: 15px;
    }

    .btn-qty {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 1px solid #ff5722;
      background: white;
      color: #ff5722;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .qty-input {
      width: 30px;
      text-align: center;
      border: none;
      font-weight: bold;
      font-size: 16px;
      background: transparent;
    }

    /* Form Styles */
    .form-group {
      margin-bottom: 12px;
    }
    .form-group label {
      display: block;
      font-weight: bold;
      margin-bottom: 5px;
      font-size: 14px;
      color: #333;
    }
    .form-group input, .form-group textarea, .form-group select {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 8px;
      box-sizing: border-box;
      font-family: inherit;
    }
    textarea {
      resize: vertical;
      min-height: 60px;
    }

    .checkout{
      position:sticky;
      bottom:0;
      background:white;
      padding:15px;
      box-shadow:0 -5px 15px rgba(0,0,0,0.1);
      margin-top:20px;
    }

    .total{
      font-size:22px;
      font-weight:bold;
      margin-bottom:10px;
      color:#ff5722;
      display: flex;
      justify-content: space-between;
    }

    button.btn-order {
      width:100%;
      padding:15px;
      border:none;
      border-radius:10px;
      background:#25D366;
      color:white;
      font-size:18px;
      font-weight:bold;
      cursor:pointer;
      transition: 0.3s;
    }

    button.btn-order:hover{
      background: #1eb954;
    }

    input[type="checkbox"]{
      width:24px;
      height:24px;
      cursor: pointer;
      accent-color: #ff5722;
    }
  </style>
</head>
<body>

<header>
  OKTSHOP17 - Pesan Cemilan
</header>

<div class="container">
  <div class="welcome">
    <b>Halo kak, mau pilih cemilan apa kak? 🤗</b><br>
    Silahkan tentukan jumlah (qty) dan centang barang yang ingin dipesan.
  </div>

  <!-- Daftar Menu -->
  <div id="menu-list"></div>

  <!-- Form Data Pengiriman -->
  <div class="product">
    <h3>Detail Pengiriman & Pembayaran</h3>
    
    <div class="form-group">
      <label>Nama Penerima:</label>
      <input type="text" id="buyer_name" placeholder="Masukkan nama Anda">
    </div>

    <div class="form-group">
      <label>No. Penerima (WhatsApp):</label>
      <input type="tel" id="buyer_phone" placeholder="Contoh: 08123456789">
    </div>

    <div class="form-group">
      <label>Alamat Kirim:</label>
      <textarea id="buyer_address" placeholder="Tulis alamat lengkap (Jalan, No. Rumah, Patokan)"></textarea>
    </div>

    <div class="form-group">
      <label>Metode Pembayaran:</label>
      <select id="payment_method">
        <option value="Transfer / QRIS">Transfer / QRIS</option>
        <option value="Cash / COD">Cash / COD</option>
      </select>
    </div>

    <div class="form-group">
      <label>Kirim Pakai:</label>
      <select id="delivery_method">
        <option value="COD">COD</option>
        <option value="MAXIM">MAXIM</option>
      </select>
    </div>
  </div>

  <div class="checkout">
    <div class="total">
      <span>Total Bayar:</span>
      <span>Rp <span id="total">0</span></span>
    </div>

    <button class="btn-order" onclick="checkoutWA()">
      Pesan via WhatsApp
    </button>
  </div>
</div>

<script>
const phoneNumber = "62895345452412"; 

const menus = [
  {
    category:"Keripik Kaca",
    items:[
      ["1Kg",70000], ["500gr",36000], ["250gr",22000], ["100gr",10000], ["125gr",12000]
    ]
  },
  {
    category:"Usus Crispy",
    items:[
      ["1Kg",105000], ["500gr",55000], ["250gr",28000], ["100gr",13000]
    ]
  },
  {
    category:"Basreng Stik",
    items:[
      ["1Kg",75000], ["500gr",45000], ["250gr",23000], ["125gr",13000]
    ]
  },
  {
    category:"Baso Aci",
    items:[
      ["Ayam Suir",10000], ["Tetelan",10000], ["Urat",12000], ["Original",6000]
    ]
  },
  {
    category:"Menu Lainnya",
    items:[
      ["Basreng Bojot",5000], ["Otak-Otak Bojot",5000], ["Cireng Isi",2000],
      ["Cireng Kuah Keju Creamy",10000], ["Aneka ES",2000], ["Pop Ice",3000], ["Good Day Freeze",5000]
    ]
  }
];

const menuList = document.getElementById("menu-list");

// Render Menu
menus.forEach((menu, mIdx) => {
  let html = `<div class="product"><h3>${menu.category}</h3>`;
  menu.items.forEach((item, iIdx) => {
    const itemId = `item_${mIdx}_${iIdx}`;
    html += `
      <div class="item">
        <div class="item-info">
          <span class="item-name">${item[0]}</span>
          <span class="item-price">Rp ${item[1].toLocaleString("id-ID")}</span>
        </div>
        
        <div class="qty-control">
          <button class="btn-qty" onclick="changeQty('${itemId}', -1)">-</button>
          <input type="text" class="qty-input" id="qty-${itemId}" value="1" readonly>
          <button class="btn-qty" onclick="changeQty('${itemId}', 1)">+</button>
        </div>

        <input 
          type="checkbox" 
          id="check-${itemId}" 
          class="item-checkbox"
          data-name="${menu.category} ${item[0]}" 
          data-price="${item[1]}" 
          data-id="${itemId}"
          onchange="updateTotal()"
        >
      </div>
    `;
  });
  html += `</div>`;
  menuList.innerHTML += html;
});

function changeQty(id, delta) {
  const input = document.getElementById(`qty-${id}`);
  const checkbox = document.getElementById(`check-${id}`);
  let val = parseInt(input.value) + delta;
  
  if (val < 1) val = 1;
  input.value = val;

  checkbox.checked = true;
  updateTotal();
}

function updateTotal() {
  let total = 0;
  document.querySelectorAll(".item-checkbox:checked").forEach(cb => {
    const id = cb.dataset.id;
    const price = parseInt(cb.dataset.price);
    const qty = parseInt(document.getElementById(`qty-${id}`).value);
    total += (price * qty);
  });
  document.getElementById("total").innerText = total.toLocaleString("id-ID");
}

function checkoutWA() {
  const selected = document.querySelectorAll(".item-checkbox:checked");
  
  // Ambil data form
  const name = document.getElementById("buyer_name").value;
  const phone = document.getElementById("buyer_phone").value;
  const address = document.getElementById("buyer_address").value;
  const payment = document.getElementById("payment_method").value;
  const delivery = document.getElementById("delivery_method").value;

  if (selected.length === 0) {
    alert("Pilih minimal satu cemilan dulu ya kak.");
    return;
  }

  if (!name || !phone || !address) {
    alert("Harap lengkapi data penerima dan alamat ya kak.");
    return;
  }

  let message = "*PESANAN CEMILAN - OKTSHOP17*\n";
  message += "--------------------------------------\n";
  
  let grandTotal = 0;
  selected.forEach((cb, index) => {
    const id = cb.dataset.id;
    const itemName = cb.dataset.name;
    const price = parseInt(cb.dataset.price);
    const qty = parseInt(document.getElementById(`qty-${id}`).value);
    const subtotal = price * qty;
    grandTotal += subtotal;

    message += `${index + 1}. *${itemName}*\n`;
    message += `   ${qty} x Rp ${price.toLocaleString("id-ID")} = Rp ${subtotal.toLocaleString("id-ID")}\n`;
  });

  message += "--------------------------------------\n";
  message += `*TOTAL BAYAR: Rp ${grandTotal.toLocaleString("id-ID")}*\n\n`;
  
  message += `*DETAIL PENERIMA:*\n`;
  message += `👤 Nama: ${name}\n`;
  message += `📞 No. HP: ${phone}\n`;
  message += `📍 Alamat: ${address}\n\n`;
  
  message += `*METODE PESANAN:*\n`;
  message += `💳 Bayar via: ${payment}\n`;
  message += `🚚 Kirim pakai: ${delivery}\n`;

  const url = `https://wa.me/${phoneNumber}?text=${encodeURIComponent(message)}`;
  window.open(url, "_blank");
}
</script>

</body>
</html>
