<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Absensi Siswa Modern</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-50 text-slate-800 pb-20">

    <!-- Header -->
    <header class="bg-indigo-600 text-white p-4 sticky top-0 z-50 shadow-md">
        <div class="container mx-auto flex justify-between items-center">
            <div>
                <h1 id="display-school-name" class="font-bold text-lg">Nama Sekolah</h1>
                <p id="display-school-address" class="text-xs opacity-80">Alamat Sekolah</p>
            </div>
            <button onclick="showSection('settings')"><i data-lucide="settings" class="w-6 h-6"></i></button>
        </div>
    </header>

    <main class="container mx-auto p-4 max-w-md md:max-w-4xl">

        <!-- DASHBOARD -->
        <section id="section-dashboard" class="content-section">
            <h2 class="text-xl font-bold mb-4">Dashboard</h2>
            <div class="grid grid-cols-2 gap-4 mb-6">
                <div class="bg-white p-4 rounded-2xl shadow-sm border-l-4 border-indigo-500">
                    <p class="text-sm text-slate-500">Hadir Hari Ini</p>
                    <p id="count-present" class="text-2xl font-bold">0</p>
                </div>
                <div class="bg-white p-4 rounded-2xl shadow-sm border-l-4 border-red-500">
                    <p class="text-sm text-slate-500">Belum Absen</p>
                    <p id="count-absent" class="text-2xl font-bold">0</p>
                </div>
            </div>
            <div class="bg-indigo-50 p-6 rounded-2xl text-center border-2 border-dashed border-indigo-200">
                <i data-lucide="qr-code" class="w-12 h-12 mx-auto mb-2 text-indigo-600"></i>
                <p class="font-medium">Siap untuk melakukan absensi?</p>
                <button onclick="showSection('scanner')" class="mt-3 bg-indigo-600 text-white px-6 py-2 rounded-full font-semibold">Buka Kamera Scan</button>
            </div>
        </section>

        <!-- DATA SISWA -->
        <section id="section-students" class="content-section hidden">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-bold">Data Siswa</h2>
                <button onclick="openStudentModal()" class="bg-green-500 text-white p-2 rounded-full shadow-lg"><i data-lucide="plus"></i></button>
            </div>
            <input type="text" id="search-student" placeholder="Cari nama atau kelas..." class="w-full p-3 rounded-xl border mb-4 outline-none focus:ring-2 focus:ring-indigo-500">
            <div id="student-list" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- Card Siswa akan muncul di sini -->
            </div>
        </section>

        <!-- SCANNER -->
        <section id="section-scanner" class="content-section hidden text-center">
            <h2 class="text-xl font-bold mb-4">Scan QR Code</h2>
            <div id="scanner-status" class="text-sm text-red-500 mb-2 font-medium"></div>
            <div id="reader" class="rounded-xl overflow-hidden shadow-lg bg-black min-h-[280px] flex items-center justify-center">
                <p id="reader-placeholder" class="text-white text-sm p-4">Meminta izin kamera...</p>
            </div>
            <!-- Canvas tersembunyi untuk mengambil snapshot dari video -->
            <canvas id="snapshot-canvas" class="hidden"></canvas>
            <button onclick="showSection('dashboard')" class="mt-6 text-red-500 font-semibold underline">Batalkan</button>
        </section>

        <!-- RIWAYAT -->
        <section id="section-history" class="content-section hidden">
            <h2 class="text-xl font-bold mb-4">Riwayat Absensi</h2>
            <div id="history-list" class="space-y-3">
                <!-- Riwayat item -->
            </div>
        </section>

        <!-- LAPORAN -->
        <section id="section-reports" class="content-section hidden">
            <h2 class="text-xl font-bold mb-4">Laporan Kehadiran</h2>
            <div id="report-list" class="bg-white rounded-2xl shadow-sm overflow-hidden">
                <!-- Table laporan -->
            </div>
        </section>

        <!-- DATA KELAS -->
        <section id="section-classes" class="content-section hidden">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-bold">Data Kelas</h2>
                <button onclick="addClass()" class="bg-indigo-600 text-white px-4 py-2 rounded-lg text-sm">Tambah Kelas</button>
            </div>
            <ul id="class-list" class="bg-white rounded-xl shadow-sm divide-y"></ul>
        </section>

        <!-- PENGATURAN / PROFIL SEKOLAH -->
        <section id="section-settings" class="content-section hidden">
            <h2 class="text-xl font-bold mb-4">Profil Sekolah</h2>
            <div class="bg-white p-6 rounded-2xl shadow-sm space-y-4">
                <div>
                    <label class="text-xs font-bold text-slate-400 uppercase">Nama Sekolah</label>
                    <input type="text" id="input-school-name" class="w-full border-b py-2 outline-none">
                </div>
                <div>
                    <label class="text-xs font-bold text-slate-400 uppercase">Alamat</label>
                    <input type="text" id="input-school-address" class="w-full border-b py-2 outline-none">
                </div>
                <button onclick="saveSchoolProfile()" class="w-full bg-indigo-600 text-white py-3 rounded-xl font-bold">Simpan Profil</button>
            </div>
            <div class="mt-8">
                <button onclick="clearAllData()" class="text-red-500 text-sm flex items-center gap-2">
                    <i data-lucide="trash-2" class="w-4 h-4"></i> Reset Semua Data
                </button>
            </div>
        </section>

    </main>

    <!-- Bottom Navigation -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t flex justify-around py-3 px-2 z-50">
        <button onclick="showSection('dashboard')" class="nav-btn active text-indigo-600" data-section="dashboard">
            <i data-lucide="layout-grid" class="mx-auto"></i>
            <span class="text-[10px]">Home</span>
        </button>
        <button onclick="showSection('students')" class="nav-btn text-slate-400" data-section="students">
            <i data-lucide="users" class="mx-auto"></i>
            <span class="text-[10px]">Siswa</span>
        </button>
        <button onclick="showSection('scanner')" class="nav-btn text-slate-400" data-section="scanner">
            <div class="bg-indigo-600 p-3 rounded-full -mt-10 shadow-lg text-white">
                <i data-lucide="scan"></i>
            </div>
        </button>
        <button onclick="showSection('history')" class="nav-btn text-slate-400" data-section="history">
            <i data-lucide="history" class="mx-auto"></i>
            <span class="text-[10px]">Riwayat</span>
        </button>
        <button onclick="showSection('reports')" class="nav-btn text-slate-400" data-section="reports">
            <i data-lucide="file-bar-chart" class="mx-auto"></i>
            <span class="text-[10px]">Laporan</span>
        </button>
    </nav>

    <!-- Modal Tambah Siswa -->
    <div id="modal-student" class="fixed inset-0 bg-black/50 hidden z-[60] flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-sm rounded-3xl p-6">
            <h3 class="text-lg font-bold mb-4" id="modal-title">Tambah Siswa</h3>
            <div class="space-y-4">
                <input type="hidden" id="student-id">
                <input type="text" id="student-name" placeholder="Nama Lengkap" class="w-full p-3 bg-slate-100 rounded-xl outline-none">
                <select id="student-class" class="w-full p-3 bg-slate-100 rounded-xl outline-none"></select>
                <input type="tel" id="parent-phone" placeholder="No. WA Orang Tua (628...)" class="w-full p-3 bg-slate-100 rounded-xl outline-none">
                <div class="flex gap-2 pt-2">
                    <button onclick="closeStudentModal()" class="flex-1 py-3 font-semibold text-slate-500">Batal</button>
                    <button onclick="saveStudent()" class="flex-1 py-3 bg-indigo-600 text-white rounded-xl font-semibold">Simpan</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Preview Foto Absensi -->
    <div id="modal-photo" class="fixed inset-0 bg-black/60 hidden z-[70] flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-sm rounded-3xl p-6 text-center">
            <h3 class="text-lg font-bold mb-1">Absensi Berhasil</h3>
            <p id="photo-student-name" class="text-slate-500 text-sm mb-4"></p>
            <img id="photo-preview" src="" class="rounded-xl w-full mb-4 border" alt="Foto absensi">
            <div class="flex flex-col gap-2">
                <button onclick="downloadSnapshot()" class="w-full py-3 bg-slate-100 rounded-xl font-semibold flex items-center justify-center gap-2">
                    <i data-lucide="download" class="w-4 h-4"></i> Simpan Foto
                </button>
                <button onclick="sendWhatsAppWithPhoto()" class="w-full py-3 bg-green-500 text-white rounded-xl font-semibold flex items-center justify-center gap-2">
                    <i data-lucide="send" class="w-4 h-4"></i> Kirim WA ke Orang Tua
                </button>
                <button onclick="closePhotoModal()" class="w-full py-2 text-slate-400 text-sm">Tutup</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
